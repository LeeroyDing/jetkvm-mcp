name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Loopback WebRTC negotiation deadlines in tests are upper bounds, not
      # timing assertions. Under -race on shared runners the 15s local default
      # blew twice on 2026-08-15 (TestScreenshotToolReturnsImageAndWritesNothing);
      # give establishment steps generous headroom here. The override can only
      # extend deadlines (see connectTimeout in the test helpers).
      JETKVM_TEST_CONNECT_TIMEOUT: 90s
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up manifest-available Go bootstrap
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go's manifest can lag an official Go patch. This bootstrap
          # only launches Go's exact toolchain-module selection below.
          go-version: '1.26.5'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            .go-version

      - name: Select and verify the canonical Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < .go-version)" == "1.26.6" ]]
          toolchain_root="$(GOTOOLCHAIN=go1.26.6 go env GOROOT)"
          [[ "$(GOTOOLCHAIN=local "$toolchain_root/bin/go" env GOVERSION)" == "go1.26.6" ]]
          [[ -x "$toolchain_root/bin/gofmt" ]]
          echo "GOTOOLCHAIN=go1.26.6" >> "$GITHUB_ENV"
          echo "$toolchain_root/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$("$(go env GOROOT)/bin/gofmt" -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet integration build
        run: go vet -tags integration ./...

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          go tool staticcheck ./...
          go tool staticcheck -tags integration ./...

      - name: Lint workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Secret scan
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 detect --no-git --source . --redact --no-banner --no-color

      - name: Compile integration-tag surface
        run: go test -tags integration -run '^$' ./...

      - name: Unit tests and aggregate coverage gate
        shell: bash
        env:
          # The post-hardening atomic baseline is 82.7%; leave 2.7 percentage
          # points for honest refactors and small execution-path variability.
          MINIMUM_COVERAGE: '80.0'
        run: |
          set -euo pipefail
          export LC_ALL=C
          coverage_profile="$RUNNER_TEMP/coverage.out"
          go test -count=1 -covermode=atomic -coverprofile="$coverage_profile" ./...

          # Capture first so any cover-tool error propagates through errexit.
          # Then require exactly one well-formed aggregate line: missing,
          # duplicated, or otherwise changed output fails closed.
          coverage_report="$(go tool cover -func="$coverage_profile")"
          total="$(awk '
              $1 == "total:" { matches++; value = $NF }
              END {
                if (matches != 1) { exit 1 }
                print value
              }
            ' <<< "$coverage_report")"
          if [[ ! "$total" =~ ^[0-9]+([.][0-9]+)?%$ ]]; then
            echo "could not parse aggregate statement coverage" >&2
            exit 1
          fi
          actual="${total%\%}"
          if [[ ! "$MINIMUM_COVERAGE" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "invalid configured coverage floor" >&2
            exit 1
          fi
          if ! awk -v actual="$actual" -v minimum="$MINIMUM_COVERAGE" \
            'BEGIN { exit !(actual + 0 >= minimum + 0) }'; then
            echo "aggregate statement coverage ${actual}% is below ${MINIMUM_COVERAGE}%" >&2
            exit 1
          fi
          echo "aggregate statement coverage ${actual}% meets ${MINIMUM_COVERAGE}%"

      # -p 1 serializes the per-package test binaries in the race lanes.
      # By default go test runs them concurrently (-p = nproc), which put
      # the internal/jetkvm and internal/mcpserver loopback WebRTC suites
      # on the same starved vCPUs at once under -race; on shared runners
      # that intermittently stalled ICE past pion's ~30s failed timer
      # ("peer connection closed before becoming connected", 2026-08-15
      # PR #15 quality failures). Serializing removes the contention
      # multiplier without touching any test or assertion.
      - name: Race tests
        run: go test -race -p 1 ./...

      - name: Concurrency and control soak
        run: go test -race -p 1 -count=5 -run 'Control|HID|Release|Lease|Handshake|Screenshot' ./internal/jetkvm/ ./internal/mcpserver/

      - name: Verify tidy module files
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  codeql:
    name: codeql-go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up manifest-available Go bootstrap
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            .go-version

      - name: Select and verify the canonical Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < .go-version)" == "1.26.6" ]]
          toolchain_root="$(GOTOOLCHAIN=go1.26.6 go env GOROOT)"
          [[ "$(GOTOOLCHAIN=local "$toolchain_root/bin/go" env GOVERSION)" == "go1.26.6" ]]
          [[ -x "$toolchain_root/bin/gofmt" ]]
          echo "GOTOOLCHAIN=go1.26.6" >> "$GITHUB_ENV"
          echo "$toolchain_root/bin" >> "$GITHUB_PATH"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          build-mode: manual

      - name: Build analyzed source
        run: go build ./...

      - name: Analyze Go
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:go

  platform:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # Same shared-runner headroom for connect deadlines as the quality job;
      # extend-only, so local defaults and timing assertions are unchanged.
      JETKVM_TEST_CONNECT_TIMEOUT: 90s
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up manifest-available Go bootstrap
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go's manifest can lag an official Go patch. This bootstrap
          # only launches Go's exact toolchain-module selection below.
          go-version: '1.26.5'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            .go-version

      - name: Select and verify the canonical Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < .go-version)" == "1.26.6" ]]
          toolchain_root="$(GOTOOLCHAIN=go1.26.6 go env GOROOT)"
          [[ "$(GOTOOLCHAIN=local "$toolchain_root/bin/go" env GOVERSION)" == "go1.26.6" ]]
          [[ -x "$toolchain_root/bin/gofmt" ]]
          echo "GOTOOLCHAIN=go1.26.6" >> "$GITHUB_ENV"
          echo "$toolchain_root/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Verify native platform and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(go env GOOS)" == "${{ matrix.goos }}" ]]
          [[ "$(go env GOARCH)" == "${{ matrix.goarch }}" ]]
          ffmpeg -version >/dev/null

      - name: Native unit tests
        run: go test ./...

  # Branch protection requires this stable, non-matrix aggregate context.
  test:
    name: test
    if: always()
    needs: [quality, codeql, platform]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every CI lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUALITY_RESULT" == "success" ]]
          [[ "$CODEQL_RESULT" == "success" ]]
          [[ "$PLATFORM_RESULT" == "success" ]]
