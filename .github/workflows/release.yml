name: Release candidate

# Two entry points:
# - Tag push (v*): the real release path. Full provenance gates, then
#   reproducible build -> attestation -> DRAFT release assets. Publishing
#   the draft stays a human action.
# - workflow_dispatch: DRY RUN. Same reproducible build, checksum, and
#   artifact-hygiene pipeline against the chosen ref, uploading a
#   workflow artifact only. No tag gates, no attestation, no release
#   mutation of any kind - it exists so the pipeline is verifiable
#   without burning an immutable version tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-checksummed-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.provenance.outputs.commit }}
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out the complete history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up manifest-available Go bootstrap
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          # setup-go's manifest can lag an official Go patch. This bootstrap
          # only launches Go's exact toolchain-module selection below.
          go-version: '1.26.5'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            .go-version

      - name: Select and verify the canonical Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < .go-version)" == "1.26.6" ]]
          toolchain_root="$(GOTOOLCHAIN=go1.26.6 go env GOROOT)"
          [[ "$(GOTOOLCHAIN=local "$toolchain_root/bin/go" env GOVERSION)" == "go1.26.6" ]]
          [[ -x "$toolchain_root/bin/gofmt" ]]
          echo "GOTOOLCHAIN=go1.26.6" >> "$GITHUB_ENV"
          echo "$toolchain_root/bin" >> "$GITHUB_PATH"

      - name: Validate provenance (immutable tag) or derive dry-run identity
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IS_TAG_BUILD: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/buildinfo/buildinfo.go)"
          [[ -n "$source_version" ]]
          commit="$(git rev-parse HEAD)"
          [[ -z "$(git status --porcelain)" ]]

          if [[ "$IS_TAG_BUILD" == "true" ]]; then
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$TAG" == "v$source_version" ]]
            [[ "$(git rev-parse "${TAG}^{commit}")" == "$commit" ]]
            git show-ref --verify --quiet refs/remotes/origin/main
            git merge-base --is-ancestor "$commit" refs/remotes/origin/main

            # A protected-main commit is necessary but not sufficient: fail
            # closed unless its stable aggregate CI check completed
            # successfully.
            gh api \
              "/repos/${REPOSITORY}/commits/${commit}/check-runs?check_name=test&filter=latest&per_page=100" \
              > "$RUNNER_TEMP/required-checks.json"
            jq -e --arg commit "$commit" '
              .check_runs | any(
                .name == "test" and
                .head_sha == $commit and
                .app.slug == "github-actions" and
                .status == "completed" and
                .conclusion == "success"
              )
            ' "$RUNNER_TEMP/required-checks.json" >/dev/null
          fi

          epoch="$(git show -s --format=%ct "$commit")"
          build_date="$(date -u -d "@$epoch" '+%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "version=$source_version"
            echo "commit=$commit"
            echo "epoch=$epoch"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"

      - name: Build deterministic archives
        env:
          VERSION: ${{ steps.provenance.outputs.version }}
          COMMIT: ${{ steps.provenance.outputs.commit }}
          EPOCH: ${{ steps.provenance.outputs.epoch }}
          BUILD_DATE: ${{ steps.provenance.outputs.build_date }}
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$RUNNER_TEMP/jetkvm-release-stage"
          repro_root="$RUNNER_TEMP/jetkvm-release-rebuild"
          [[ ! -e "$stage_root" && ! -e "$repro_root" ]]
          mkdir -p "$stage_root" "$repro_root"
          export SOURCE_DATE_EPOCH="$EPOCH"
          ldflags="-buildid= -s -w -X github.com/leeroyding/jetkvm-mcp/internal/buildinfo.Version=$VERSION -X github.com/leeroyding/jetkvm-mcp/internal/buildinfo.Commit=$COMMIT -X github.com/leeroyding/jetkvm-mcp/internal/buildinfo.BuildDate=$BUILD_DATE"

          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="jetkvmctl_${VERSION}_${goos}_${goarch}"
            stage="$stage_root/$archive"
            rebuilt="$repro_root/$archive/jetkvmctl"
            mkdir -p "$stage"
            mkdir -p "$(dirname "$rebuilt")"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "$stage/jetkvmctl" ./cmd/jetkvmctl
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "$rebuilt" ./cmd/jetkvmctl
            cmp "$stage/jetkvmctl" "$rebuilt"

            go version -m "$stage/jetkvmctl" > "$repro_root/$archive.go-version-m"
            grep -F $'\tbuild\tvcs=git' "$repro_root/$archive.go-version-m"
            grep -F $'\tbuild\tvcs.revision='"$COMMIT" "$repro_root/$archive.go-version-m"
            grep -F $'\tbuild\tvcs.time='"$BUILD_DATE" "$repro_root/$archive.go-version-m"
            grep -F $'\tbuild\tvcs.modified=false' "$repro_root/$archive.go-version-m"

            cp LICENSE README.md "$stage/"
            sed '1s|^[^:]*:|jetkvmctl:|' \
              "$repro_root/$archive.go-version-m" > "$stage/GO-BUILDINFO.txt"
          done

          # Keep every build output outside the checkout until all VCS-stamped
          # binaries exist; an untracked dist/ would set vcs.modified=true.
          [[ -z "$(git status --porcelain)" ]]

          # Inspect the exact payload tree before packaging. Gitleaks catches
          # recognized formats in bundled text. It skips application binaries,
          # so extract printable strings from every executable and scan those
          # separately before packaging. Extend every default rule and allow
          # only exact, public Go artifact strings under the one rule they
          # trigger. Dependency or toolchain drift therefore fails closed.
          artifact_scan_config="$RUNNER_TEMP/gitleaks-release-artifacts.toml"
          cat > "$artifact_scan_config" <<'EOF'
          title = "JetKVM release artifacts"

          [extend]
          useDefault = true

          [[rules]]
          id = "generic-api-key"

            [[rules.allowlists]]
            description = "Public golang.org/x/oauth2 module checksum (inherited from the v0.2.0 pipeline; harmless when absent)"
            regexTarget = "secret"
            regexes = ['''^hqK/t4AKgbqWkdkcAeI8XLmbK\+4m4G5YeQRrmiotGlw=$''']

            [[rules.allowlists]]
            description = "Go fmt.Scan string-table adjacency"
            regexTarget = "secret"
            regexes = ['''^booleanbdoUxXvintegercomplexfloat32float64$''']
          EOF
          go run github.com/zricethezav/gitleaks/v8@v8.24.3 detect \
            --no-git --source "$stage_root" --config "$artifact_scan_config" \
            --redact --no-banner
          strings_root="$RUNNER_TEMP/jetkvm-release-strings"
          mkdir "$strings_root"
          binary_count=0
          while IFS= read -r -d '' binary; do
            binary_count=$((binary_count + 1))
            strings_file="$strings_root/binary-${binary_count}.txt"
            strings -a "$binary" > "$strings_file"
            [[ -s "$strings_file" ]]
          done < <(find "$stage_root" -type f -name jetkvmctl -print0 | LC_ALL=C sort -z)
          [[ "$binary_count" -eq 4 ]]
          go run github.com/zricethezav/gitleaks/v8@v8.24.3 detect \
            --no-git --source "$strings_root" --config "$artifact_scan_config" \
            --redact --no-banner
          canary_matches="$(
            find "$stage_root" "$strings_root" -type f -size -50M \
              -exec grep -a -E -l \
              'CREDENTIAL-CANARY|PASSWORD-CANARY|TOKEN-CANARY|USERINFO-CANARY|QUERY-CREDENTIAL|sup3r-s3cret' \
              {} + || true
          )"
          [[ -z "$canary_matches" ]]

          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="jetkvmctl_${VERSION}_${goos}_${goarch}"
            tar --sort=name --mtime="@$EPOCH" --owner=0 --group=0 --numeric-owner \
              -C "$stage_root" -cf - "$archive" | gzip -n -9 > "dist/$archive.tar.gz"
            tar --sort=name --mtime="@$EPOCH" --owner=0 --group=0 --numeric-owner \
              -C "$stage_root" -cf - "$archive" | gzip -n -9 > "$repro_root/$archive.tar.gz"
            cmp "dist/$archive.tar.gz" "$repro_root/$archive.tar.gz"
          done

          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "buildDate=$BUILD_DATE"
            echo "sourceDateEpoch=$EPOCH"
            echo "goVersion=$(go version)"
            echo "targets=darwin/amd64,darwin/arm64,linux/amd64,linux/arm64"
            echo "runtimeDependency=ffmpeg"
          } > dist/BUILDINFO

          (
            cd dist
            sha256sum BUILDINFO jetkvmctl_*.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS
          )

      - name: Validate embedded version and checksums
        env:
          VERSION: ${{ steps.provenance.outputs.version }}
          COMMIT: ${{ steps.provenance.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir verify
          tar -xzf "dist/jetkvmctl_${VERSION}_linux_amd64.tar.gz" -C verify
          version_json="$("verify/jetkvmctl_${VERSION}_linux_amd64/jetkvmctl" --version)"
          grep -F "\"version\": \"$VERSION\"" <<<"$version_json"
          grep -F "\"commit\": \"$COMMIT\"" <<<"$version_json"
          go version -m "verify/jetkvmctl_${VERSION}_linux_amd64/jetkvmctl" > verify/go-version-m
          grep -F $'\tbuild\tvcs.revision='"$COMMIT" verify/go-version-m
          grep -F $'\tbuild\tvcs.modified=false' verify/go-version-m
          (cd dist && sha256sum --check SHA256SUMS)

          expected_assets="$(printf '%s\n' \
            BUILDINFO \
            SHA256SUMS \
            "jetkvmctl_${VERSION}_darwin_amd64.tar.gz" \
            "jetkvmctl_${VERSION}_darwin_arm64.tar.gz" \
            "jetkvmctl_${VERSION}_linux_amd64.tar.gz" \
            "jetkvmctl_${VERSION}_linux_arm64.tar.gz" | LC_ALL=C sort)"
          actual_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$actual_assets" == "$expected_assets" ]]
          expected_payloads="$(printf '%s\n' \
            BUILDINFO \
            "jetkvmctl_${VERSION}_darwin_amd64.tar.gz" \
            "jetkvmctl_${VERSION}_darwin_arm64.tar.gz" \
            "jetkvmctl_${VERSION}_linux_amd64.tar.gz" \
            "jetkvmctl_${VERSION}_linux_arm64.tar.gz" | LC_ALL=C sort)"
          checksum_payloads="$(awk '{print $2}' dist/SHA256SUMS | LC_ALL=C sort)"
          [[ "$(wc -l < dist/SHA256SUMS)" -eq 5 ]]
          [[ "$checksum_payloads" == "$expected_payloads" ]]

      - name: Upload release candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.event_name == 'workflow_dispatch' && 'dryrun' || 'candidate' }}-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/BUILDINFO
          if-no-files-found: error
          retention-days: 14

  attest:
    name: attest-validated-assets
    # Tag builds only: a dry run must leave no attestation behind.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download validated candidate assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist

      - name: Attest release provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: 'dist/*'

  attach-draft:
    name: attach-to-draft
    # Tag builds only: a dry run must never touch releases.
    if: github.event_name == 'push'
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download candidate assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist

      - name: Create or update a draft release only
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "commit=$EXPECTED_COMMIT" dist/BUILDINFO

          version="${TAG#v}"
          expected_assets="$(printf '%s\n' \
            BUILDINFO \
            SHA256SUMS \
            "jetkvmctl_${version}_darwin_amd64.tar.gz" \
            "jetkvmctl_${version}_darwin_arm64.tar.gz" \
            "jetkvmctl_${version}_linux_amd64.tar.gz" \
            "jetkvmctl_${version}_linux_arm64.tar.gz" | LC_ALL=C sort)"
          candidate_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$candidate_assets" == "$expected_assets" ]]
          expected_payloads="$(printf '%s\n' \
            BUILDINFO \
            "jetkvmctl_${version}_darwin_amd64.tar.gz" \
            "jetkvmctl_${version}_darwin_arm64.tar.gz" \
            "jetkvmctl_${version}_linux_amd64.tar.gz" \
            "jetkvmctl_${version}_linux_arm64.tar.gz" | LC_ALL=C sort)"
          checksum_payloads="$(awk '{print $2}' dist/SHA256SUMS | LC_ALL=C sort)"
          [[ "$(wc -l < dist/SHA256SUMS)" -eq 5 ]]
          [[ "$checksum_payloads" == "$expected_payloads" ]]

          # Re-resolve immediately before the release mutation. Protected tag
          # rules are authoritative, while this bounded peel closes the
          # build/attach window even if that external control is misconfigured.
          ref_json="$(gh api "/repos/${GH_REPO}/git/ref/tags/${TAG}")"
          current_type="$(jq -r .object.type <<<"$ref_json")"
          current_sha="$(jq -r .object.sha <<<"$ref_json")"
          for _ in 1 2 3 4; do
            [[ "$current_type" == "tag" ]] || break
            tag_json="$(gh api "/repos/${GH_REPO}/git/tags/${current_sha}")"
            current_type="$(jq -r .object.type <<<"$tag_json")"
            current_sha="$(jq -r .object.sha <<<"$tag_json")"
          done
          [[ "$current_type" == "commit" ]]
          [[ "$current_sha" == "$EXPECTED_COMMIT" ]]

          if release_json="$(gh release view "$TAG" --json isDraft,assets 2>/dev/null)"; then
            grep -F '"isDraft":true' <<<"$release_json"
            existing_assets="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
            unexpected_assets="$(comm -23 \
              <(printf '%s\n' "$existing_assets") \
              <(printf '%s\n' "$expected_assets"))"
            [[ -z "$unexpected_assets" ]]
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --draft \
              --title "jetkvmctl $TAG" \
              --notes "Draft release candidate. FFmpeg is a required runtime dependency for screenshots. Verify downloads with SHA256SUMS before use."
          fi
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]]

          actual_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          [[ "$actual_assets" == "$expected_assets" ]]
          verify_dir="$(mktemp -d)"
          gh release download "$TAG" --dir "$verify_dir"
          downloaded_assets="$(find "$verify_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$downloaded_assets" == "$expected_assets" ]]
          while IFS= read -r asset; do
            cmp "dist/$asset" "$verify_dir/$asset"
          done <<<"$expected_assets"
